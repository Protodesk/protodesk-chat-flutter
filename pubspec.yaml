name: protodesk_chat
description: Customer support chat SDK for Flutter with secure sessions, realtime messaging, attachments, push integration, and accessible localized UI.
homepage: https://protodesk.io
repository: https://github.com/Protodesk/protodesk-chat-flutter
issue_tracker: https://github.com/Protodesk/protodesk-chat-flutter/issues
topics:
  - chat
  - customer-support
  - sdk
  - live-chat
  - support-widget
screenshots:
  - description: Messenger Home with suggested Help articles
    path: screenshots/home.png
  - description: A conversation with a support agent
    path: screenshots/conversation.png
  - description: Help Center search and topic collections
    path: screenshots/help.png
  - description: A PDF attachment in a dark conversation
    path: screenshots/dark-conversation.png
platforms:
  android:
  ios:
version: 0.1.5
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
  plugin:
    platforms:
      android:
        package: com.protodesk.chat
        pluginClass: ProtodeskChatPlugin
      ios:
        pluginClass: ProtodeskChatPlugin
