name: protodesk_chat
description: Customer support chat SDK for Flutter with secure sessions, realtime messaging, attachments, push integration, and accessible localized UI.
homepage: https://protodesk.io
repository: https://github.com/Protodesk/protodesk-chat-flutter
issue_tracker: https://github.com/Protodesk/protodesk-chat-flutter/issues
topics:
  - chat
  - customer-support
  - sdk
  - live-chat
  - support-widget
screenshots:
  - description: Home tab with recent conversation and Help Center
    path: screenshots/home.png
  - description: A conversation with a support agent
    path: screenshots/conversation.png
  - description: Help Center
    path: screenshots/help.png
  - description: Dark theme with a message queued while offline
    path: screenshots/dark-offline.png
platforms:
  android:
  ios:
version: 0.1.1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.protodesk.chat
        pluginClass: ProtodeskChatPlugin
      ios:
        pluginClass: ProtodeskChatPlugin
